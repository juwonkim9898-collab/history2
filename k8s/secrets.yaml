# Secrets - 민감한 정보 (base64 인코딩 필요)
# 실제 배포 시 값을 base64로 인코딩해서 사용
# echo -n 'value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: history-app
type: Opaque
data:
  # DB_USER: tuser -> dHVzZXI=
  DB_USER: dHVzZXI=
  # DB_PASSWORD: test123 -> dGVzdDEyMw==
  DB_PASSWORD: dGVzdDEyMw==
  # JWT_SECRET: your-jwt-secret (변경 필요)
  JWT_SECRET: eW91ci1qd3Qtc2VjcmV0
